[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipai-api"
version = "1.0.0"
description = "Backend REST API assíncrona do CLIPAÍ — plataforma brasileira de clipes de jogadas."
readme = "docs/PRD.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "httpx>=0.28.0,<1.0.0",
    "boto3>=1.35.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "RUF",   # ruff-specific rules
]
ignore = [
    "B008",  # Allow FastAPI Depends() in function defaults
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]
"alembic/env.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "alembic/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
