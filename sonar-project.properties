# SonarCloud project configuration
# Atualize projectKey e organization conforme o projeto criado no SonarCloud.
sonar.projectKey=Davi-PF_clipai-api
sonar.organization=personal-p-dpf

sonar.projectName=CLIPAÍ API
sonar.projectVersion=1.0.0

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Relatório de cobertura gerado pelo pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Exclusões de análise e cobertura
sonar.exclusions=alembic/**,docs/**,.venv/**
sonar.coverage.exclusions=alembic/**,tests/**,app/**/__init__.py
